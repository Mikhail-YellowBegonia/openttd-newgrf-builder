name: Build

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newgrf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Python
        run: uv python install 3.12.10
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y golang libjpeg-dev zlib1g-dev
      - name: Create virtual environment
        run: uv venv --python 3.12.10
      - name: Install Python dependencies
        run: uv pip install -r requirements.txt
      - name: Build NewGRF
        run: uv run make
      - name: Upload NewGRF
        uses: actions/upload-artifact@v4
        with:
          name: china-set-buildings
          path: building.grf
          if-no-files-found: error
